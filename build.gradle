plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"pvp-client" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

tasks.register('printCp') { def files = sourceSets.client.compileClasspath.files; doLast { files.each { println it } } }

// Optional local test-profile deployment. Keep the machine-specific path in
// local.properties so it is never committed to the repository.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
	localPropertiesFile.withInputStream { localProperties.load(it) }
}

def testModsDir = localProperties.getProperty('testModsDir')
tasks.register('deployTestMod', Copy) {
	group = 'fabric'
	description = 'Copies the production mod into the locally configured test profile.'
	dependsOn tasks.named('jar')
	onlyIf { testModsDir != null && !testModsDir.isBlank() }
	from(tasks.named('jar').flatMap { it.archiveFile })
	into(testModsDir ?: layout.buildDirectory.dir('disabled-test-deploy'))
	rename { 'pvp-client-dev.jar' }
}

tasks.register('syncCurrentVersionJar', Copy) {
	group = 'build'
	description = 'Copies the current production jar into the repository versions directory.'
	dependsOn tasks.named('jar')
	from(tasks.named('jar').flatMap { it.archiveFile })
	into(rootProject.file('versions'))
}

tasks.named('build') {
	finalizedBy tasks.named('deployTestMod'), tasks.named('syncCurrentVersionJar')
}

tasks.register('buildMinecraft12111', GradleBuild) {
	group = 'build'
	description = 'Builds the Minecraft 1.21.11 port.'
	dir = file('ports/mc1_21_11')
	tasks = ['clean', 'build']
}

tasks.register('buildMinecraft1214', GradleBuild) {
	group = 'build'
	description = 'Builds the Minecraft 1.21.4 port.'
	dir = file('ports/mc1_21_4')
	tasks = ['clean', 'build']
}

tasks.register('buildAllVersions') {
	group = 'build'
	description = 'Builds the current mod and every maintained Minecraft port.'
	dependsOn tasks.named('build'), tasks.named('buildMinecraft12111'), tasks.named('buildMinecraft1214')
}
